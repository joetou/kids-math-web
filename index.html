<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eff8f3"><title>數學探險手帳</title><link rel="stylesheet" href="style.css?v=2"></head><body>
<header><a href="./" class="brand">✦ 數學探險手帳</a><div class="tools"><button id="library" aria-label="選擇關卡">🗺️ <span>揀關卡</span></button><select id="language" aria-label="語言"><option value="zh">中文</option><option value="both">中英</option><option value="en">English</option></select><button id="settings-button" aria-label="朗讀設定">⚙️</button></div></header>
<main><nav id="phases" aria-label="學習步驟"></nav><div class="lesson-line"><span id="topic-position"></span><span id="stars"></span></div><div id="screen" aria-live="polite"><p class="loading">正在準備探險…</p></div></main>
<dialog id="library-dialog"><div class="dialog-head"><h2>🗺️ 揀一個關卡</h2><button data-close="library-dialog" aria-label="關閉">✕</button></div><label>探險主題<select id="category"></select></label><div id="lessons"></div></dialog>
<dialog id="settings"><div class="dialog-head"><h2>🔊 朗讀小幫手</h2><button data-close="settings" aria-label="關閉">✕</button></div><p>按「聽題目」用廣東話讀出題目。優先使用裝置的廣東話女聲。</p><label>聲音<select id="voice-select"></select></label><p id="voice-status" class="small"></p><label class="check"><input id="auto-read" type="checkbox">轉步驟時自動朗讀</label><button id="voice-test">試聽：我哋一齊諗下啦！</button><button id="stop-voice">停止朗讀</button><button id="mute">音效開啟</button><details><summary>家長及老師：題庫備註</summary><div id="review-notes"></div></details></dialog>
<div id="confetti" aria-hidden="true"></div><script src="app.js?v=2"></script></body></html>
