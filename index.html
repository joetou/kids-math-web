<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eff8f3"><title>Math Adventure</title><link rel="stylesheet" href="style.css?v=5"></head><body>
<header><a href="./" class="brand">✦ <span data-zh="數學探險手帳" data-en="Math Adventure">Math Adventure</span></a><div class="tools"><button id="library" aria-label="選擇關卡"><b class="adventure-icon" aria-hidden="true">🗺️</b><span>More Adventures</span><small data-zh="22 關等你玩" data-en="22 adventures to explore">22 adventures to explore</small></button><select id="language" aria-label="語言"><option value="en" selected>English</option><option value="zh">中文</option><option value="both">中英</option></select><button id="settings-button" aria-label="朗讀設定">⚙️</button></div></header>
<main><nav id="phases" aria-label="學習步驟"></nav><div class="lesson-line"><span id="topic-position"></span><span id="stars"></span></div><div id="screen" aria-live="polite"><p class="loading">Getting your adventure ready…</p></div></main>
<dialog id="library-dialog"><div class="dialog-head"><h2 data-zh="🗺️ 揀一個關卡" data-en="🗺️ Choose an adventure">🗺️ Choose an adventure</h2><button data-close="library-dialog" aria-label="Close">✕</button></div><label><span data-zh="探險主題" data-en="Adventure theme">Adventure theme</span><select id="category"></select></label><div id="lessons"></div></dialog>
<dialog id="settings"><div class="dialog-head"><h2 data-zh="🔊 朗讀小幫手" data-en="🔊 Cantonese reading buddy">🔊 Cantonese reading buddy</h2><button data-close="settings" aria-label="Close">✕</button></div><p data-zh="按「聽題目」用廣東話讀出題目。優先使用裝置的廣東話女聲。" data-en="Tap Listen to hear the question in Cantonese. A Cantonese female voice is preferred when available.">Tap Listen to hear the question in Cantonese. A Cantonese female voice is preferred when available.</p><label><span data-zh="聲音" data-en="Voice">Voice</span><select id="voice-select"></select></label><p id="voice-status" class="small"></p><label class="check"><input id="auto-read" type="checkbox"><span data-zh="轉步驟時自動朗讀" data-en="Read automatically when changing steps">Read automatically when changing steps</span></label><button id="voice-test" data-zh="試聽：我哋一齊諗下啦！" data-en="Try the Cantonese voice">Try the Cantonese voice</button><button id="stop-voice" data-zh="停止朗讀" data-en="Stop reading">Stop reading</button><button id="mute">音效開啟</button><details><summary data-zh="家長及老師：題庫備註" data-en="For adults: question bank notes">For adults: question bank notes</summary><div id="review-notes"></div></details></dialog>
<div id="confetti" aria-hidden="true"></div><script src="app.js?v=5"></script></body></html>
